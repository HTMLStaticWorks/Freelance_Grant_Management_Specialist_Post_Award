<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Insights | Aidora Enterprise</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- CSS Dependencies -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dashboard.css">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://img.icons8.com/fluency/48/safe-ok.png">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
</head>
<body data-theme="light" class="dashboard-body">

    <div class="sidebar-overlay" id="sidebar-overlay"></div>
    
    <div class="dashboard-wrapper">
        <!-- Sidebar (Standardized) -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header mb-4">
                <a href="index.html" class="d-flex align-items-center text-decoration-none">
                    <div class="brand-icon-bg me-2">
                        <i data-lucide="shield-check" class="text-white" style="width: 24px; height: 24px;"></i>
                    </div>
                    <span class="fw-bold fs-5 brand-text">Aidora</span>
                </a>
            </div>

            <div class="sidebar-content flex-grow-1">
                <div class="sidebar-group mb-4">
                    <p class="sidebar-group-title">Main Menu</p>
                    <nav>
                        <a href="dashboard.html" class="sidebar-link">
                            <i data-lucide="layout-grid"></i>
                            <span>Overview</span>
                        </a>
                    </nav>
                </div>

                <div class="sidebar-group mb-4">
                    <p class="sidebar-group-title">Analytics</p>
                    <nav>
                        <a href="db-financials.html" class="sidebar-link active">
                            <i data-lucide="bar-chart-3"></i>
                            <span>Financial Insights</span>
                        </a>
                        <a href="db-compliance.html" class="sidebar-link">
                            <i data-lucide="clipboard-check"></i>
                            <span>Audit Readiness</span>
                        </a>
                    </nav>
                </div>

                <div class="sidebar-group">
                    <p class="sidebar-group-title">Assets</p>
                    <nav>
                        <a href="db-documents.html" class="sidebar-link">
                            <i data-lucide="file-text"></i>
                            <span>Document Vault</span>
                        </a>
                    </nav>
                </div>
            </div>

            <div class="sidebar-footer pt-4 border-top">
                <div class="user-card-sidebar p-3 rounded-4 mb-3">
                    <div class="d-flex align-items-center gap-3">
                        <div class="avatar-circle-sm">SJ</div>
                        <div class="flex-grow-1 overflow-hidden">
                            <p class="small fw-bold mb-0 text-truncate">Sarah Jenkins</p>
                            <p class="x-small text-secondary mb-0 text-truncate">Sarah.j@aidora.com</p>
                        </div>
                    </div>
                </div>
                <a href="index.html" class="sidebar-link logout-btn">
                    <i data-lucide="log-out"></i>
                    <span>Log Out</span>
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="dashboard-main">
            <header class="topbar sticky-top glass-effect px-4 py-3 border-bottom">
                <div class="d-flex justify-content-between align-items-center w-100">
                    <div class="d-flex align-items-center gap-3">
                        <button class="btn btn-icon d-lg-none" id="mobile-nav-toggle"><i data-lucide="menu"></i></button>
                        <h5 class="mb-0 fw-bold">Financial Oversight</h5>
                    </div>
                    <div class="d-flex align-items-center gap-3">
                        <div class="avatar-circle">SJ</div>
                    </div>
                </div>
            </header>

            <div class="dashboard-content p-4">
                <div class="row g-4 mb-4">
                    <div class="col-lg-12">
                        <div class="premium-card shadow-xl p-4">
                            <h6 class="fw-bold mb-4">Revenue vs. Expenditure</h6>
                            <div id="financialMainChart"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="assets/js/main.js"></script>
    <script>
        $(document).ready(function() {
            lucide.createIcons();
            
            var financialOptions = {
                series: [{ name: 'Budget', data: [100, 100, 100, 100, 100] }, { name: 'Spent', data: [20, 35, 55, 70, 85] }],
                chart: { type: 'bar', height: 350, stacked: false, toolbar: { show: false }, fontFamily: 'Inter, sans-serif' },
                colors: ['#e2e8f0', '#6366f1'],
                xaxis: { categories: ['Q1', 'Q2', 'Q3', 'Q4', 'Current'] }
            };
            new ApexCharts(document.querySelector("#financialMainChart"), financialOptions).render();
        });
    </script>
</body>
</html>
