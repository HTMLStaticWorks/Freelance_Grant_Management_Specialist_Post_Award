<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | GrantPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .login-card {
            max-width: 450px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="login-card p-4">
        <div class="text-center mb-5">
            <a href="index.html" class="d-flex align-items-center justify-content-center gap-2 mb-4">
                <i data-lucide="shield-check" class="text-dark" style="width: 32px; height: 32px;"></i>
                <span class="fw-bold fs-3">GrantPro</span>
            </a>
            <h2 class="fw-bold">Welcome Back</h2>
            <p class="text-muted">Access your grant management portal</p>
        </div>

        <div class="glass-card p-5">
            <form>
                <div class="mb-4">
                    <label class="form-label small fw-bold">Work Email</label>
                    <input type="email" class="form-control bg-light border-0 p-3" placeholder="name@organization.org">
                </div>
                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <label class="form-label small fw-bold mb-0">Password</label>
                        <a href="#" class="small text-muted">Forgot password?</a>
                    </div>
                    <div class="input-group">
                        <input type="password" class="form-control bg-light border-0 p-3" placeholder="••••••••">
                        <span class="input-group-text bg-light border-0"><i data-lucide="eye" style="width: 18px;"></i></span>
                    </div>
                </div>
                <div class="mb-4 form-check">
                    <input type="checkbox" class="form-check-input" id="remember">
                    <label class="form-check-label small" for="remember">Remember me for 30 days</label>
                </div>
                <button type="submit" class="btn btn-premium btn-premium-primary w-100 py-3 mb-4">Sign In</button>
                
                <div class="text-center position-relative mb-4">
                    <hr>
                    <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 small text-muted">OR</span>
                </div>

                <div class="d-grid gap-3">
                    <button type="button" class="btn btn-outline-dark py-2 d-flex align-items-center justify-content-center gap-2">
                        <i data-lucide="chrome" style="width: 18px;"></i> Google
                    </button>
                    <button type="button" class="btn btn-outline-dark py-2 d-flex align-items-center justify-content-center gap-2">
                        <i data-lucide="linkedin" style="width: 18px;"></i> LinkedIn
                    </button>
                </div>
            </form>
        </div>

        <div class="text-center mt-4">
            <p class="small text-muted">Don't have an account? <a href="register.html" class="fw-bold text-dark">Request Access</a></p>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
