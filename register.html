<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Aidora Client Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://img.icons8.com/fluency/48/safe-ok.png">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
            color: var(--text-primary);
            position: relative;
            padding: 40px 20px;
        }
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://images.unsplash.com/photo-1431540015161-0bf868a2d407?auto=format&fit=crop&q=100&w=3840') center/cover no-repeat;
            opacity: 0.05;
            z-index: -1;
        }
        .auth-card-container {
            width: 100%;
            max-width: 520px;
            z-index: 1;
        }
        .premium-auth-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px;
            box-shadow: var(--card-shadow);
        }
        .social-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            font-size: 14px;
            font-weight: 500;
        }
        .social-btn:hover {
            background: rgba(0, 0, 0, 0.05);
            border-color: var(--accent);
        }
        [data-theme="dark"] .social-btn:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .form-control, .form-select {
            background: var(--bg-alt);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 12px 16px;
        }
        .form-control:focus, .form-select:focus {
            background: var(--bg-primary);
            border-color: var(--accent);
            box-shadow: none;
            color: var(--text-primary);
        }
        .form-select option {
            background: var(--bg-primary);
            color: var(--text-primary);
        }
    </style>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body data-theme="light">

    <div class="auth-card-container">
        <div class="premium-auth-card">
            <div class="text-center mb-5">
                                <a href="index.html" class="d-flex align-items-center justify-content-center text-decoration-none mb-4">
                    <i data-lucide="shield-check" class="me-2 text-primary" style="width: 32px; height: 32px;"></i>
                    <span class="fw-bold fs-3 text-primary">Aidora</span>
                </a>
                <h2 class="h4 fw-bold">Request Client Dashboard Access</h2>
                <p class=" opacity-50 small">Create an account to monitor your grant portfolios</p>
            </div>

            <!-- Social Logins -->
            <div class="row g-3 mb-4">
                <div class="col-6">
                    <button class="social-btn rounded-3 w-100">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                        </svg>
                        Google
                    </button>
                </div>
                <div class="col-6">
                    <button class="social-btn rounded-3 w-100">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 4.17c.66-.81 1.11-1.93.99-3.06-1 .04-2.2.67-2.92 1.49-.62.71-1.16 1.85-1.01 2.97 1.12.09 2.26-.59 2.94-1.4" fill="currentColor"/>
                        </svg>
                         Apple
                     </button>
                 </div>
            </div>


            <form action="dashboard.html">
                <div class="mb-3">
                    <label class="form-label small fw-bold opacity-75">Full Name</label>
                    <input type="text" class="form-control rounded-3" placeholder="Enter your full name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold opacity-75">Organization Name</label>
                    <input type="text" class="form-control rounded-3" placeholder="e.g. Health Frontiers NGO" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold opacity-75">Organization Type</label>
                    <select class="form-select rounded-3">
                        <option>Non-Profit Organization</option>
                        <option>University / Research</option>
                        <option>Government Agency</option>
                        <option>International NGO</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label small fw-bold opacity-75">Work Email</label>
                    <input type="email" class="form-control rounded-3" placeholder="Enter your work email" required>
                </div>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label small fw-bold opacity-75">Password</label>
                        <div class="input-group">
                            <input type="password" class="form-control rounded-3 border-end-0" id="passwordInput" placeholder="Password" required>
                            <button class="btn btn-outline-secondary border-start-0 opacity-50" type="button" id="togglePassword">
                                <i data-lucide="eye" style="width: 18px;"></i>
                            </button>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold opacity-75">Confirm Password</label>
                        <input type="password" class="form-control rounded-3" id="confirmPasswordInput" placeholder="Confirm Password" required>
                    </div>
                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="termsAgree" required>
                    <label class="form-check-label small opacity-75" for="termsAgree">I agree to the <a href="#" class="text-primary text-decoration-none fw-bold">Terms of Service</a></label>
                </div>

                <button type="submit" class="btn-premium btn-primary-premium w-100 justify-content-center py-3 rounded-3 mb-4">Request Access</button>

                <p class="text-center small mb-0 opacity-75">Already have client access? <a href="login.html" class="text-primary fw-bold text-decoration-none">Sign In</a></p>
            </form>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="assets/js/main.js"></script>
    <script>
        lucide.createIcons();
        $('#togglePassword').on('click', function() {
            const input = $('#passwordInput');
            const type = input.attr('type') === 'password' ? 'text' : 'password';
            input.attr('type', type);
            $(this).find('i').remove();
            $(this).append(`<i data-lucide="${type === 'password' ? 'eye' : 'eye-off'}" style="width: 18px;"></i>`);
            lucide.createIcons();
        });
    </script>
</body>
</html>
