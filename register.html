<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | GrantPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background: var(--bg-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .register-card {
            max-width: 500px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="register-card p-4">
        <div class="text-center mb-5">
            <a href="index.html" class="d-flex align-items-center justify-content-center gap-2 mb-4">
                <i data-lucide="shield-check" class="text-dark" style="width: 32px; height: 32px;"></i>
                <span class="fw-bold fs-3">GrantPro</span>
            </a>
            <h2 class="fw-bold">Create Enterprise Account</h2>
            <p class="text-muted">Start your journey to zero-risk compliance</p>
        </div>

        <div class="glass-card p-5">
            <form>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">First Name</label>
                        <input type="text" class="form-control bg-light border-0 p-3" placeholder="Jane">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Last Name</label>
                        <input type="text" class="form-control bg-light border-0 p-3" placeholder="Smith">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-bold">Organization Name</label>
                    <input type="text" class="form-control bg-light border-0 p-3" placeholder="World Health Initiative">
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-bold">Work Email</label>
                    <input type="email" class="form-control bg-light border-0 p-3" placeholder="jane@organization.org">
                </div>
                <div class="mb-4">
                    <label class="form-label small fw-bold">Password</label>
                    <input type="password" class="form-control bg-light border-0 p-3" placeholder="Minimum 12 characters">
                </div>
                <div class="mb-4 form-check">
                    <input type="checkbox" class="form-check-input" id="terms">
                    <label class="form-check-label small" for="terms">I agree to the <a href="#" class="text-dark fw-bold">Terms of Service</a> and <a href="#" class="text-dark fw-bold">Privacy Policy</a></label>
                </div>
                <button type="submit" class="btn btn-premium btn-premium-primary w-100 py-3 mb-4">Create Account</button>
                
                <div class="d-grid gap-3">
                    <button type="button" class="btn btn-outline-dark py-2 d-flex align-items-center justify-content-center gap-2">
                        <i data-lucide="chrome" style="width: 18px;"></i> Sign up with Google
                    </button>
                </div>
            </form>
        </div>

        <div class="text-center mt-4">
            <p class="small text-muted">Already have an account? <a href="login.html" class="fw-bold text-dark">Log In</a></p>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
